[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "aqua-opt"
version = "0.1.0"
description = "Zero-dependency aquaculture water-quality & pond optimization toolkit: Emerson un-ionized NH3 toxicity, elevation-adjusted Benson-Krause dissolved oxygen saturation, aerator sizing, and tilapia/catfish FCR feeding planner."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Akandwanaho Ivan Alvin" }]
keywords = [
    "aquaculture",
    "tilapia",
    "water-quality",
    "ammonia-toxicity",
    "dissolved-oxygen",
    "agritech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
aqua-opt = "aqua_opt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aqua_opt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
